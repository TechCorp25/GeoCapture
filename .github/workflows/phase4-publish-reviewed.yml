name: GeoCapture Phase 4 independently reviewed municipal pack release
on:
  workflow_dispatch:
  push:
    branches: ["feature/phase4-maribyrnong-road-pack-release", "feature/phase4-arterial-minor-road-audit"]
    paths:
      - "scripts/release_phase4_reviewed.py"
      - "scripts/audit_municipal_candidates.py"
      - "municipal-road-loader.js"
      - "index.html"
      - "sw.js"
      - "tests/phase4-loader.test.cjs"
      - ".github/workflows/phase4-publish-reviewed.yml"
permissions:
  contents: write
  actions: read
jobs:
  independently-verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing server dependencies
        run: python -m pip install -r requirements.txt
      - name: Run baseline tests before generating the new versioned packages
        run: |
          python -m unittest discover -s tests -v
          node --test $(find tests -name "*.test.cjs" ! -name "phase4-production.test.cjs" | sort)
      - name: Recover byte-exact Phase 4 audited source and staging snapshot
        uses: actions/download-artifact@v4
        with:
          name: maribyrnong-phase4-whole-council-inventory
          run-id: 38686980656
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/phase4-release-input
      - name: Independently re-audit official arterial class 2 and minor-access class 6 road topology
        run: |
          python -m scripts.audit_municipal_candidates \
            --source work/phase4-release-input/roads.geojson \
            --source-manifest work/phase4-release-input/roads-manifest.json \
            --candidates work/phase4-release-input/block-candidates.geojson \
            --boundary work/phase4-release-input/lga.geojson \
            --boundary-manifest work/phase4-release-input/lga-manifest.json \
            --dispositions work/phase4-release-input/candidate-dispositions.json \
            --verified work/phase4-release-input/eligible-not-published.geojson \
            --report work/phase4-release-input/independent-audit.json \
            --include-arterial-and-minor-access
          python -m scripts.maribyrnong_inventory \
            --source work/phase4-release-input/roads.geojson \
            --source-manifest work/phase4-release-input/roads-manifest.json \
            --boundary work/phase4-release-input/lga.geojson \
            --boundary-manifest work/phase4-release-input/lga-manifest.json \
            --candidates work/phase4-release-input/block-candidates.geojson \
            --dispositions work/phase4-release-input/candidate-dispositions.json \
            --published data/reviewed/maribyrnong-talbot-cowper-dead-end.geojson \
            --published data/reviewed/maribyrnong-footscray-phase3-20261015.geojson \
            --output work/phase4-release-input/complete-road-feature-ledger.json \
            --candidate-ledger work/phase4-release-input/road-block-ledger.json \
            --report work/phase4-release-input/municipal-inventory-report.json
          python -m scripts.stage_municipal_packs \
            --eligible work/phase4-release-input/eligible-not-published.geojson \
            --candidate-ledger work/phase4-release-input/road-block-ledger.json \
            --source-manifest work/phase4-release-input/roads-manifest.json \
            --lga-manifest work/phase4-release-input/lga-manifest.json \
            --output-dir work/phase4-release-input/staging-packages
      - name: Re-audit every staged block against official road UFI topology, source PFIs and council polygon
        run: |
          python -m scripts.release_phase4_reviewed \
            --audit work/phase4-release-input \
            --output municipal-data \
            --published data/reviewed/maribyrnong-talbot-cowper-dead-end.geojson \
            --published data/reviewed/maribyrnong-footscray-phase3-20261015.geojson
      - name: Check all independently reviewed blocks and source provenance
        run: |
          python - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path('municipal-data/manifest.json').read_text())
          assert len(m['packages'])==10 and 1454 <= m['newSourceQualifiedRoadBlocks'] <= 2000
          assert m['publishedExistingRoadBlocks']==33 and not m['operationalCoverageComplete']
          total=0; allids=set()
          for name,item in m['packages'].items():
            d=json.loads(pathlib.Path('municipal-data',name+'.json').read_text())
            assert all(s['reviewState']=='OFFICIAL_SOURCE_TOPOLOGY_VERIFIED_HANDSET_QA_PENDING'
                       for s in d['segments'])
            assert len(d['segments'])>=item['roadBlocks']
            new={s['id'] for s in d['segments']}
            assert len(new)==len(d['segments']) and not new & allids
            allids.update(new); total+=len(d['segments'])
          assert total==m['newGeometryEdges'] and len(m['reviewedVicmapClasses'])==5
          print('Release review passed',m['newSourceQualifiedRoadBlocks'],'blocks',total,'edges')
          PY
      - name: Run end-to-end production package and local matcher regressions
        run: |
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -v
      - name: Commit approved source-verified, handset-QA-pending static municipal packs on feature branch
        if: github.ref == 'refs/heads/feature/phase4-arterial-minor-road-audit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipal-data/
          if ! git diff --cached --quiet; then
            git commit -m "GeoCapture: release arterial and minor access Vicmap road blocks with offline QA gates [skip ci]"
            git push origin HEAD:feature/phase4-arterial-minor-road-audit
          fi
      - name: Archive byte-exact review and emitted pack manifest for traceability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geocapture-phase4-approved-package-release-evidence
          path: |
            municipal-data/
            work/phase4-release-input/municipal-inventory-report.json
            work/phase4-release-input/candidate-dispositions.json
          if-no-files-found: warn
          retention-days: 30
